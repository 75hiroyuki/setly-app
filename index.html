<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Setly</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#14213d">
<style>html,body{margin:0;height:100%;background:#14213d;color:#e8eef8;font:15px sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#msg{padding:24px;line-height:1.7}</style></head><body>
<div id="msg" hidden>Setlyの接続先が未設定です。<br>最初に、このページのURLの末尾に <code>#</code> と接続先IDを付けて一度開いてください。</div>
<script>
(function(){
  var K='setlyGasId', id='';
  try{ var h=location.hash.replace(/^#/,''); if(h){localStorage.setItem(K,h); history.replaceState(null,'',location.pathname);} id=localStorage.getItem(K)||''; }catch(e){}
  if(!/^[A-Za-z0-9_-]{20,}$/.test(id)){document.getElementById('msg').hidden=false;return;}
  var f=document.createElement('iframe');
  f.src='https://script.google.com/macros/s/'+id+'/exec?page=timebox';
  f.allow='clipboard-write; fullscreen';
  document.body.appendChild(f);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script></body></html>
